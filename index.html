<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي - بوت تليجرام</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e272e, #485460);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: #ffffff;
            color: #2f3640;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h1 {
            color: #0088cc;
            margin-bottom: 10px;
        }
        p {
            color: #718093;
            font-size: 16px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #0088cc;
            color: white;
            padding: 10px 20px;
            margin-top: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>أهلاً بك!</h1>
        <p>هذا هو موقعي التجريبي الأول المرتبط ببوت تليجرام بنجاح تام.</p>
        <a href="#" class="btn">تواصل معنا</a>
    </div>

</body>
</html>
