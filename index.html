<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي المكتمل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e272e, #485460);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: #ffffff;
            color: #2d3436;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 350px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* بديل الصورة: دائرة هندسية برمجية مبهجة بداخلها رمز كمبيوتر */
        .avatar-geometric {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #05c46b; /* اللون الأخضر المميز */
            border: 4px solid #1e272e;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px; /* حجم الرمز التعبيري بالداخل */
            box-shadow: 0 5px 15px rgba(5, 196, 107, 0.4);
        }

        h1 { font-size: 24px; margin: 10px 0 5px 0; color: #1e272e; }
        .title { color: #05c46b; font-weight: bold; font-size: 14px; margin-bottom: 15px; text-transform: uppercase; }
        p { color: #778ca3; font-size: 15px; line-height: 1.5; }
        .social-btn {
            display: block;
            width: 100%;
            box-sizing: border-radius;
            background-color: #0fbcf9;
            color: white;
            text-decoration: none;
            padding: 12px 0;
            margin: 10px 0;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }
        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(15, 188, 249, 0.4);
        }
        .telegram { background-color: #26a5e4; }
        .facebook { background-color: #3b5998; }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- الدائرة الهندسية الذكية البديلة للصورة المحجوبة -->
        <div class="avatar-geometric">👨‍💻</div>
        
        <h1>المبرمج الواعد 💻</h1>
        <div class="title">مطور مواقع وبوتات مستقبلي</div>
        <p>أهلاً بك في صفحتي الشخصية. اليوم قمت بتشغيل لابتوب لينوفو الجديد لأول مرة، وبدأت رحلتي في عالم البرمجة وتصميم واجهات الويب بنجاح مذهل!</p>
        
        <a href="#" target="_blank" class="social-btn telegram">تواصل معي عبر تلغرام 🚀</a>
        <a href="#" target="_blank" class="social-btn facebook">تابعني على فيسبوك 🔹</a>
    </div>

</body>
</html>
