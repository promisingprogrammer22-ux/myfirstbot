<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب الاحترافية - بوت تليجرام</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p {
            color: #94a3b8;
        }
        .game-container {
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }
        .choices button, .game-container button {
            background-color: #38bdf8;
            border: none;
            color: #0f172a;
            font-size: 16px;
            padding: 10px 18px;
            margin: 6px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .choices button:hover, .game-container button:hover {
            background-color: #0ea5e9;
            transform: scale(1.05);
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            width: 60%;
            margin-bottom: 10px;
            text-align: center;
        }
        .result {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }
        .dice-display {
            font-size: 40px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <h1>منصة الألعاب الترفيهية</h1>
    <p>استمتع بتحدي الألعاب داخل بوتك على التليجرام!</p>

    <!-- اللعبة الأولى: الحجر والورق والمقص -->
    <div class="game-container">
        <h2>🪨 الحجر، الورق، المقص</h2>
        <p>اختر حركتك:</p>
        <div class="choices">
            <button onclick="playRPS('حجر')">حجر</button>
            <button onclick="playRPS('ورق')">ورق</button>
            <button onclick="playRPS('مقص')">مقص</button>
        </div>
        <div class="result" id="rpsResult">اختر لنبدأ التحدي!</div>
    </div>

    <!-- اللعبة الثانية: تخمين الرقم -->
    <div class="game-container">
        <h2>🔢 تخمين الرقم السرّي</h2>
        <p>خمّن رقماً بين 1 و 10:</p>
        <input type="number" id="userGuess" min="1" max="10" placeholder="أدخل رقمك هنا">
        <br>
        <button onclick="checkGuess()">تحقق من الرقم</button>
        <div class="result" id="guessResult">حاول تخمين الرقم الصحيح!</div>
    </div>

    <!-- اللعبة الثالثة: رمي النرد السريع -->
    <div class="game-container">
        <h2>🎲 حظ النرد السريع</h2>
        <p>اضغط للرمي واكتشف حظك (الهدف ظهور رقم 6):</p>
        <div class="dice-display" id="diceIcon">🎲</div>
        <button onclick="rollDice()">ا رمِ النرد</button>
        <div class="result" id="diceResult">جاهز لاختبار الحظ؟</div>
    </div>

    <script>
        // كود اللعبة الأولى
        function playRPS(userChoice) {
            const choices = ['حجر', 'ورق', 'مقص'];
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];
            let result = '';

            if (userChoice === computerChoice) {
                result = `تعادل! البوت اختار (${computerChoice})`;
            } else if (
                (userChoice === 'حجر' && computerChoice === 'مقص') ||
                (userChoice === 'ورق' && computerChoice === 'حجر') ||
                (userChoice === 'مقص' && computerChoice === 'ورق')
            ) {
                result = `🎉 مبروك فزت! البوت اختار (${computerChoice})`;
            } else {
                result = `❌ حظاً أوفر، البوت فاز! اختار (${computerChoice})`;
            }
            document.getElementById('rpsResult').innerText = result;
        }

        // كود اللعبة الثانية
        const secretNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {
            const userNum = Number(document.getElementById('userGuess').value);
            const guessResult = document.getElementById('guessResult');

            if (!userNum) {
                guessResult.innerText = "⚠️ الرجاء إدخال رقم صحيح أولاً!";
                return;
            }

            if (userNum === secretNumber) {
                guessResult.innerText = `🎉 كفو! لقد أصبت الرقم السري (${secretNumber}) بنجاح!`;
            } else if (userNum > secretNumber) {
                guessResult.innerText = "📉 رقمك أكبر من الرقم السري، جرب رقماً أصغر.";
            } else {
                guessResult.innerText = "📈 رقمك أصغر من الرقم السري، جرب رقماً أكبر.";
            }
        }

        // كود اللعبة الثالثة (رمي النرد)
        function rollDice() {
            const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            const randomNum = Math.floor(Math.random() * 6) + 1;
            document.getElementById('diceIcon').innerText = diceFaces[randomNum - 1];
            
            const diceResult = document.getElementById('diceResult');
            if (randomNum === 6) {
                diceResult.innerText = `🔥 مذهل! ظهر الرقم 6، لقد ربحت الكأس الذهبي! 🏆`;
            } else {
                diceResult.innerText = `🎲 ظهر الرقم (${randomNum}). حاول مرة أخرى للحصول على 6!`;
            }
        }
    </script>

</body>
</html>
