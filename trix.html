<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تريكس الملوك الذكية</title>
    <style>
        body {
            background: radial-gradient(circle, #064e3b, #022c22);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 10px 20px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.4);
        }
        h2 { color: #facc15; margin: 0; font-size: 1.2rem; }
        .top-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .top-btn:hover { background: #2563eb; }
        
        .table-area {
            position: relative;
            width: 320px;
            height: 180px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .status-box {
            background: rgba(0,0,0,0.6);
            padding: 6px 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #38bdf8;
            text-align: center;
        }
        /* منطقة ورق اللاعب في الأسفل */
        .player-hand {
            display: flex;
            gap: 5px;
            padding: 8px;
            background: rgba(0,0,0,0.6);
            border-radius: 12px;
            max-width: 100%;
            overflow-x: auto;
            min-height: 85px;
            align-items: center;
        }
        .card {
            width: 50px;
            height: 75px;
            background: #fff;
            color: #000;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
            font-size: 0.9rem;
        }
        .card:hover { transform: translateY(-8px); }
        .card.red { color: #dc2626; }

        /* النوافذ المنظمة (Modal) */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .contract-btn {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 6px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 230px;
            transition: 0.2s;
        }
        .contract-btn:hover { background: #d97706; transform: scale(1.05); }
        
        /* جدول لوحة النتائج */
        .score-table {
            width: 80%;
            max-width: 350px;
            background: #1e293b;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .score-table table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .score-table th, .score-table td {
            border: 1px solid #475569;
            padding: 8px;
            font-size: 0.95rem;
        }
        .score-table th { background: #334155; color: #facc15; }
        
        .close-modal-btn {
            margin-top: 15px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h2>♥️ تريكس الملوك</h2>
        <div>
            <button class="top-btn" onclick="openScoreboard()">📊 لوحة النتائج</button>
            <button class="top-btn" style="background:#ef4444;" onclick="window.location.href='games_platform.html'">خروج</button>
        </div>
    </header>

    <div class="status-box" id="gameStatus">اختر عقدك المطلوب وابدأ التحدي</div>

    <!-- نافذة اختيار العقد -->
    <div id="contractModal" class="modal">
        <h3 style="color: #facc15; margin-bottom: 15px;">📋 اختر العقد المطلوب</h3>
        <button class="contract-btn" onclick="selectContract('شيخ الكبة', -75)">👑 شيخ الكبة (-75)</button>
        <button class="contract-btn" onclick="selectContract('البنات', -100)">👧 البنات الأربعة (-100)</button>
        <button class="contract-btn" onclick="selectContract('الديناري', -130)">♦️ الديناري (-130)</button>
        <button class="contract-btn" onclick="selectContract('اللطوش', -195)">🃏 اللطوش (-195)</button>
        <button class="contract-btn" style="background:#3b82f6; color:#fff;" onclick="selectContract('تريكس', 200)">📈 تريكس الترتيب (موجب)</button>
    </div>

    <!-- لوحة النتائج (مخفية افتراضياً وتفتح في أي وقت) -->
    <div id="scoreModal" class="modal" style="display: none;">
        <div class="score-table">
            <h3 style="color: #facc15; margin: 0 0 10px 0;">🏆 لوحة النتائج الحالية</h3>
            <table>
                <tr>
                    <th>اللاعب</th>
                    <th>النقاط</th>
                </tr>
                <tr><td>أنت (اللاعب)</td><td id="scorePlayer">0</td></tr>
                <tr><td>البوت 1</td><td id="scoreBot1">0</td></tr>
                <tr><td>البوت 2</td><td id="scoreBot2">0</td></tr>
                <tr><td>البوت 3</td><td id="scoreBot3">0</td></tr>
            </table>
            <button class="close-modal-btn" onclick="closeScoreboard()">إغلاق</button>
        </div>
    </div>

    <div class="table-area" id="tableArea">
        <span style="color: #94a3b8; font-size: 0.9rem;">منطقة صراع الأوراق</span>
    </div>

    <div>
        <div style="font-size: 0.85rem; margin-bottom: 3px; text-align: center; color: #facc15;">أوراقك في اليد (أمعن النظر واختر بحكمة):</div>
        <div class="player-hand" id="playerHand"></div>
    </div>

    <script>
        const suits = ['♠', '♣', '♥', '♦'];
        const values = ['7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
        
        let playerHandCards = [];
        let scores = { player: 0, bot1: 0, bot2: 0, bot3: 0 };
        let currentContract = '';

        function generateHand() {
            playerHandCards = [];
            for(let i = 0; i < 13; i++) {
                let s = suits[Math.floor(Math.random() * suits.length)];
                let v = values[Math.floor(Math.random() * values.length)];
                playerHandCards.push({suit: s, val: v});
            }
            renderHand();
        }

        function renderHand() {
            const handEl = document.getElementById('playerHand');
            handEl.innerHTML = '';
            playerHandCards.forEach((card, index) => {
                const cDiv = document.createElement('div');
                const isRed = card.suit === '♥' || card.suit === '♦';
                cDiv.className = `card ${isRed ? 'red' : ''}`;
                cDiv.innerHTML = `<span>${card.val}</span><span style="font-size:18px; text-align:center;">${card.suit}</span><span>${card.val}</span>`;
                cDiv.onclick = () => playCard(index);
                handEl.appendChild(cDiv);
            });
        }

        function selectContract(name, points) {
            currentContract = name;
            document.getElementById('contractModal').style.display = 'none';
            document.getElementById('gameStatus').textContent = `العقد الحالي: ${name} | دورك للعب ورقتك الذكية`;
        }

        function openScoreboard() {
            document.getElementById('scorePlayer').textContent = scores.player;
            document.getElementById('scoreBot1').textContent = scores.bot1;
            document.getElementById('scoreBot2').textContent = scores.bot2;
            document.getElementById('scoreBot3').textContent = scores.bot3;
            document.getElementById('scoreModal').style.display = 'flex';
        }

        function closeScoreboard() {
            document.getElementById('scoreModal').style.display = 'none';
        }

        function playCard(index) {
            if (!currentContract) {
                alert('الرجاء اختيار العقد أولاً!');
                return;
            }

            let played = playerHandCards.splice(index, 1)[0];
            renderHand();

            const table = document.getElementById('tableArea');
            const isRed = played.suit === '♥' || played.suit === '♦';
            
            table.innerHTML = `
                <div style="text-align:center;">
                    <div class="card ${isRed ? 'red' : ''}" style="margin:0 auto;"><span>${played.val}</span><span style="font-size:18px; text-align:center;">${played.suit}</span><span>${played.val}</span></div>
                    <span style="font-size:0.75rem; color:#facc15;">ورقتك</span>
                </div>
            `;

            document.getElementById('gameStatus').textContent = "البوتات تفكر وتلعب بذكاء لاقتناص اللطشة...";

            // محاكاة استجابة الذكاء الاصطناعي التنافسي
            setTimeout(() => {
                let botPlayedSuit = suits[Math.floor(Math.random() * suits.length)];
                let botPlayedVal = values[Math.floor(Math.random() * values.length)];
                
                table.innerHTML += `
                    <div style="margin-right: 15px; text-align:center;">
                        <div class="card" style="margin:0 auto; background:#e2e8f0;"><span>${botPlayedVal}</span><span style="font-size:18px; text-align:center;">${botPlayedSuit}</span><span>${botPlayedVal}</span></div>
                        <span style="font-size:0.75rem; color:#38bdf8;">البوت الذكي</span>
                    </div>
                `;
                
                // حساب نتائج وهمية تنافسية للجولة وتحديثها
                let roundWinner = Math.random() > 0.5 ? "أنت" : "البوت الذكي";
                if(roundWinner === "أنت") {
                    scores.player += 10;
                } else {
                    scores.bot1 += 5;
                }

                document.getElementById('gameStatus').textContent = `انتهت الجولة: الفائز باللطشة هو (${roundWinner})! تابع اللعب.`;
            }, 1500);
        }

        // بدء توليد وتوزيع الأوراق عند فتح اللعبة ليراها اللاعب فوراً قبل الطلب
        generateHand();
    </script>
</body>
</html>
