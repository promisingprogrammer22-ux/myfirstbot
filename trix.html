<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة التريكس الملكية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1e1b4b 0%, #0f172a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow: hidden;
        }

        /* طاولة التريكس الفاخرة */
        .trix-table {
            width: 100%;
            max-width: 480px;
            height: 75vh;
            background: rgba(30, 27, 75, 0.5);
            border: 4px solid #c084fc;
            border-radius: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.7), 0 10px 30px rgba(0,0,0,0.5);
        }

        .opponent-zone {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(192, 132, 252, 0.3);
            font-size: 14px;
            font-weight: bold;
        }

        .center-title {
            text-align: center;
        }

        .center-title h2 {
            color: #c084fc;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
            margin-bottom: 5px;
        }

        .center-title p {
            font-size: 13px;
            color: #cbd5e1;
        }

        /* أوراق اللاعب */
        .player-hand {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .card {
            width: 45px;
            height: 65px;
            background: #ffffff;
            color: #000000;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card.red {
            color: #dc2626;
        }

        /* لوحة التحكم السفلية */
        .controls-panel {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(192, 132, 252, 0.3);
        }

        .btn {
            background: #c084fc;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #a855f7;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.6);
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- طاولة التريكس -->
    <div class="trix-table">
        <div class="opponent-zone">مملكة الخصم 👑 - المجموع: 0</div>

        <div class="center-title">
            <h2>👑 طاولة التريكس الملكية</h2>
            <p id="trixStatus">اختر مملكتك المفضلة وابدأ الجولة...</p>
        </div>

        <div>
            <div style="text-align: center; font-size: 12px; margin-bottom: 5px; color: #c084fc;">أوراقك</div>
            <div class="player-hand">
                <div class="card red"><span>♥ K</span><span>K</span></div>
                <div class="card"><span>♠ Q</span><span>Q</span></div>
                <div class="card red"><span>♦ J</span><span>J</span></div>
                <div class="card"><span>♣ 10</span><span>10</span></div>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="controls-panel">
        <a href="games_platform.html" class="back-link">⬅ عودة للمنصة</a>
        <button class="btn" onclick="startTrixGame()">بدء المملكة 👑</button>
        <span style="font-size: 13px; color: #4ade80;" id="trixScore">مملكتك: نشطة</span>
    </div>

    <script>
        function startTrixGame() {
            document.getElementById("trixStatus").innerText = "تم اختيار المملكة بنجاح! التحدي اشتعل.";
            alert("أهلاً بك في مملكة التريكس الملكية! استعد للمنافسة القوية.");
        }
    </script>

</body>
</html>
