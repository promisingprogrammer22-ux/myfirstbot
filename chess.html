<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الشطرنج الاحترافية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #334155 0%, #0f172a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow: hidden;
        }

        /* طاولة الشطرنج الفاخرة */
        .chess-container {
            width: 100%;
            max-width: 480px;
            height: 75vh;
            background: rgba(15, 23, 42, 0.6);
            border: 4px solid #38bdf8;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .player-info-hud {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 14px;
            font-weight: bold;
        }

        .board-grid {
            width: 260px;
            height: 260px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 3px solid #38bdf8;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .square.light {
            background: #cbd5e1;
            color: #000;
        }

        .square.dark {
            background: #475569;
            color: #fff;
        }

        /* لوحة التحكم السفلية */
        .controls-panel {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .btn {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0ea5e9;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- ساحة الشطرنج -->
    <div class="chess-container">
        <div class="player-info-hud">الخصم (🤖 العبقري) - التقييم: 1200</div>

        <!-- لوحة الشطرنج المصغرة التفاعلية -->
        <div class="board-grid" id="chessBoard">
            <!-- سيتم توليد المربعات برمجياً لإعطاء طابع احترافي -->
        </div>

        <div class="player-info-hud">أنت (⚔️ البطل) - التقييم: 1200</div>
    </div>

    <!-- لوحة التحكم -->
    <div class="controls-panel">
        <a href="games_platform.html" class="back-link">⬅ عودة للمنصة</a>
        <button class="btn" onclick="startChessGame()">بدء معركة العقول ♟️</button>
        <span style="font-size: 13px; color: #4ade80;" id="chessStatus">جاهز</span>
    </div>

    <script>
        // توليد رقعة الشطرنج بشكل تلقائي وسلس
        const board = document.getElementById('chessBoard');
        const pieces = ['♜','♞','♝','♛','♚','♝','♞','♜','♟','♟','♟','♟','♟','♟','♟','♟'];
        
        for (let i = 0; i < 64; i++) {
            const square = document.createElement('div');
            const row = Math.floor(i / 8);
            const col = i % 8;
            
            square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
            
            // وضع قطع مبدئية للتزيين والتفاعل
            if (i === 4) square.innerHTML = '♔';
            if (i === 60) square.innerHTML = '♚';
            
            board.appendChild(square);
        }

        function startChessGame() {
            document.getElementById('chessStatus').innerText = 'المعركة دائرة';
            alert('تم بدء معركة الشطرنج بنجاح! حرك قطعتك بحكمة.');
        }
    </script>

</body>
</html>
