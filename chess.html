<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج الملوك - ضد البوت</title>
    <style>
        body {
            background: radial-gradient(circle, #0f172a, #020617);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 { color: #38bdf8; margin-bottom: 5px; }
        .status { margin-bottom: 15px; font-size: 1.1rem; color: #fbbf24; }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            border: 4px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .square {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
        }
        .light { background-color: #e2e8f0; color: #000; }
        .dark { background-color: #475569; color: #000; }
        .selected { background-color: #38bdf8 !important; }
        .back-btn {
            margin-top: 20px;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .back-btn:hover { background: #2563eb; }
    </style>
</head>
<body>

    <h2>♟️ شطرنج الملوك</h2>
    <div class="status" id="gameStatus">دورك للعب (القطع البيضاء)</div>
    <div class="board" id="chessboard"></div>
    <button class="back-btn" onclick="window.location.href='games_platform.html'">العودة للمنصة</button>

    <script>
        const boardElement = document.getElementById('chessboard');
        const statusElement = document.getElementById('gameStatus');

        // رموز القطع
        const pieces = {
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙',
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟'
        };

        let board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        let turn = 'w'; // w = player, b = bot
        let selectedSquare = null;

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                        square.classList.add('selected');
                    }
                    const p = board[r][c];
                    square.textContent = p ? pieces[p] : '';
                    square.onclick = () => handleSquareClick(r, c);
                    boardElement.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            if (turn !== 'w') return; // منع اللعب أثناء دور البوت

            const p = board[r][c];
            if (selectedSquare) {
                // محاولة تحريك القطعة
                if (isWhite(p)) {
                    selectedSquare = {r, c};
                } else {
                    // حركة بسيطة للبوت
                    board[r][c] = board[selectedSquare.r][selectedSquare.c];
                    board[selectedSquare.r][selectedSquare.c] = '';
                    selectedSquare = null;
                    turn = 'b';
                    renderBoard();
                    statusElement.textContent = "دور البوت يفكر...";
                    setTimeout(botMove, 1000);
                }
                renderBoard();
            } else {
                if (p && isWhite(p)) {
                    selectedSquare = {r, c};
                    renderBoard();
                }
            }
        }

        function isWhite(p) {
            return p && p === p.toUpperCase();
        }

        function botMove() {
            // بحث عن قطع البوت السوداء وحركة عشوائية ذكية
            let blackPieces = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] && !isWhite(board[r][c])) {
                        blackPieces.push({r, c});
                    }
                }
            }

            if (blackPieces.length > 0) {
                let moved = false;
                // محاولة تحريك عشوائية صحيحة للبوت
                while(!moved && blackPieces.length > 0) {
                    let randIdx = Math.floor(Math.random() * blackPieces.length);
                    let bp = blackPieces[randIdx];
                    let moves = [{r: bp.r + 1, c: bp.c}, {r: bp.r + 1, c: bp.c + 1}, {r: bp.r + 1, c: bp.c - 1}];
                    let validMoves = moves.filter(m => m.r >= 0 && m.r < 8 && m.c >= 0 && m.c < 8 && isWhite(board[m.r][m.c]));
                    if(validMoves.length === 0) {
                        validMoves = [{r: bp.r + 1, c: bp.c}].filter(m => m.r < 8 && board[m.r][bp.c] === '');
                    }
                    if(validMoves.length > 0) {
                        let target = validMoves[Math.floor(Math.random() * validMoves.length)];
                        board[target.r][target.c] = board[bp.r][bp.c];
                        board[bp.r][bp.c] = '';
                        moved = true;
                    } else {
                        blackPieces.splice(randIdx, 1);
                    }
                }
            }
            turn = 'w';
            renderBoard();
            statusElement.textContent = "دورك للعب (القطع البيضاء)";
        }

        renderBoard();
    </script>
</body>
</html>
