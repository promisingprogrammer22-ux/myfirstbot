<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الطرنيب الاحترافية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #064e3b 0%, #022c22 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow: hidden;
        }

        /* طاولة اللعب */
        .game-table {
            width: 100%;
            max-width: 480px;
            height: 75vh;
            background: rgba(4, 120, 87, 0.4);
            border: 4px solid #facc15;
            border-radius: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5);
        }

        .player-zone {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(250, 204, 21, 0.3);
            font-size: 14px;
            font-weight: bold;
        }

        .center-area {
            text-align: center;
        }

        .center-area h2 {
            color: #facc15;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
            margin-bottom: 5px;
        }

        .center-area p {
            font-size: 13px;
            color: #cbd5e1;
        }

        /* أوراق اللاعب في الأسفل */
        .player-hand {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .card {
            width: 45px;
            height: 65px;
            background: #ffffff;
            color: #000000;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card.red {
            color: #dc2626;
        }

        /* لوحة التحكم والتحجيم */
        .controls-panel {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(250, 204, 21, 0.3);
        }

        .btn {
            background: #facc15;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #eab308;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- طاولة الطرنيب -->
    <div class="game-table">
        <!-- الخصم المقابل -->
        <div class="player-zone">الخصم (🤖 الذكاء الاصطناعي) - النقاط: 0</div>

        <!-- وسط الطاولة -->
        <div class="center-area">
            <h2>🎴 طاولة الطرنيب الملكية</h2>
            <p id="gameStatus">في انتظار بدء الجولة وتوزيع الأوراق...</p>
        </div>

        <!-- أوراق يد اللاعب -->
        <div>
            <div style="text-align: center; font-size: 12px; margin-bottom: 5px; color: #facc15;">أوراقك</div>
            <div class="player-hand" id="playerHand">
                <div class="card red"><span>♥ 7</span><span>7</span></div>
                <div class="card"><span>♠ 10</span><span>10</span></div>
                <div class="card red"><span>♦ Q</span><span>Q</span></div>
                <div class="card"><span>♣ K</span><span>K</span></div>
                <div class="card red"><span>♥ A</span><span>A</span></div>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="controls-panel">
        <a href="games_platform.html" class="back-link">⬅ عودة للمنصة</a>
        <button class="btn" onclick="startTarneebRound()">توزيع الأوراق 🃏</button>
        <span style="font-size: 13px; color: #4ade80;" id="userScore">نقاطك: 0</span>
    </div>

    <script>
        function startTarneebRound() {
            document.getElementById("gameStatus").innerText = "جاري توزيع الأوراق بحماس... حدد طلبك!";
            alert("تم توزيع الأوراق بنجاح! استعد لبدء التحدي.");
        }
    </script>

</body>
</html>
