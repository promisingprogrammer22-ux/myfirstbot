<script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // استخراج الاسم المسجل داخل البوت عبر رابط الـ Web App، أو الاعتماد على تلغرام كخيار احتياطي
        const urlParams = new URLSearchParams(window.location.search);
        let userName = urlParams.get('name');

        if (!userName) {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userName = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name || 'لاعب';
            } else {
                userName = 'لاعب';
            }
        }
        
        document.getElementById('name-bottom').textContent = userName;
        // باقي الكود البرمجي...
