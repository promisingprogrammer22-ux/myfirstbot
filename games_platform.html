<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب الاحترافية</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            max-width: 600px;
            margin: 20px auto;
        }
        .game-card {
            background: #161b22;
            border: 2px solid #00ffff;
            border-radius: 12px;
            padding: 15px;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }
        .game-card:hover {
            background: #21262d;
            transform: scale(1.05);
        }
        .game-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }
        .game-name {
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🎮 منصة الألعاب الاحترافية</h2>

    <div class="games-grid">
        <a href="#" class="game-card" onclick="openGame('tarneeb')">
            <div class="game-icon">🃏</div>
            <div class="game-name">طرنيب</div>
        </a>

        <a href="#" class="game-card" onclick="openGame('roulette')">
            <div class="game-icon">🎰</div>
            <div class="game-name">روليت</div>
        </a>

        <a href="#" class="game-card" onclick="openGame('trix')">
            <div class="game-icon">👑</div>
            <div class="game-name">تريكس</div>
        </a>

        <a href="#" class="game-card" onclick="openGame('solitaire')">
            <div class="game-icon">🎴</div>
            <div class="game-name">سوليتير</div>
        </a>

        <a href="#" class="game-card" onclick="openGame('basra')">
            <div class="game-icon">🎯</div>
            <div class="game-name">بصره</div>
        </a>

        <a href="#" class="game-card" onclick="openGame('chess')">
            <div class="game-icon">♟️</div>
            <div class="game-name">شطرنج</div>
        </a>

        <a href="#" class="game-card" onclick="openGame('rps')">
            <div class="game-icon">✂️</div>
            <div class="game-name">حجر ورقة مقص</div>
        </a>
    </div>

    <script>
        function openGame(gameName) {
            const gameFiles = {
                'tarneeb': 'tarneeb.html',
                'trix': 'trix.html',
                'chess': 'chess.html',
                'basra': 'basra.html',
                'solitaire': 'solitaire.html',
                'roulette': 'roulette.html',
                'rps': 'rps.html'
            };

            if (gameFiles[gameName]) {
                window.location.href = gameFiles[gameName];
            } else {
                alert("This game is under continuous update!");
            }
        }
    </script>

</body>
</html>
