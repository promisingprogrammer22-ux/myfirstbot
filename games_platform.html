<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة الألعاب الاحترافية - Promising Platform</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: #111827;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff007f;
            --accent-gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 12px;
            -webkit-user-select: none;
        }

        /* رأس الحساب الفاخر */
        .wallet-card {
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 15px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.1);
        }
        .user-tag {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .balance-amount {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-cyan);
            margin-top: 4px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        /* شبكة الألعاب الاحترافية */
        .platform-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 480px;
            margin: 0 auto;
        }
        .game-card {
            background: var(--card-bg);
            border: 2px solid rgba(0, 240, 255, 0.2);
            border-radius: 14px;
            padding: 20px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .game-card:hover, .game-card:active {
            border-color: var(--accent-cyan);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 240, 255, 0.25);
            background: #1a2234;
        }
        .game-icon {
            font-size: 36px;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }
        .game-name {
            font-size: 15px;
            font-weight: 700;
        }

        /* نافذة اللعب التفاعلية الداخلية */
        #game-container {
            display: none;
            background: var(--card-bg);
            border: 2px solid var(--accent-pink);
            border-radius: 16px;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.2);
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .back-btn {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            float: right;
            box-shadow: 0 3px 10px rgba(255, 68, 68, 0.3);
            transition: 0.2s;
        }
        .back-btn:active {
            transform: scale(0.95);
        }
        .game-panel-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-pink);
            margin-bottom: 10px;
            clear: both;
        }
        .action-btn, .choice-btn {
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 2px solid var(--accent-cyan);
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 20px;
            margin: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }
        .action-btn:active, .choice-btn:active {
            background: var(--accent-cyan);
            color: var(--bg-main);
            transform: scale(0.96);
        }
        .result-box {
            font-size: 16px;
            margin-top: 15px;
            font-weight: bold;
            line-height: 1.6;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- صندوق الحساب الفاخر -->
    <div class="wallet-card">
        <div class="user-tag">🚀 Promising Developer | الحساب النشط</div>
        <div class="balance-amount">الرصيد: <span id="user-score">1000</span> ل.س 🪙</div>
    </div>

    <!-- قائمة المنصة الرئيسية -->
    <div id="platform-menu">
        <div class="platform-title">🎮 منصة الألعاب الاحترافية المعتمدة</div>
        <div class="games-grid">
            <div class="game-card" onclick="openGame('rps')">
                <div class="game-icon">✂️</div>
                <div class="game-name">حجر ورقة مقص</div>
            </div>
            <div class="game-card" onclick="openGame('roulette')">
                <div class="game-icon">🎰</div>
                <div class="game-name">روليت الحظ</div>
            </div>
            <div class="game-card" onclick="openGame('solitaire')">
                <div class="game-icon">🎴</div>
                <div class="game-name">سوليتير</div>
            </div>
            <div class="game-card" onclick="openGame('chess')">
                <div class="game-icon">♟️</div>
                <div class="game-name">شطرنج</div>
            </div>
            <div class="game-card" onclick="openGame('tarneeb')">
                <div class="game-icon">🃏</div>
                <div class="game-name">طرنيب (حقيقية)</div>
            </div>
            <div class="game-card" onclick="openGame('trix')">
                <div class="game-icon">👑</div>
                <div class="game-name">تريكس</div>
            </div>
            <div class="game-card" onclick="openGame('basra')">
                <div class="game-icon">🎯</div>
                <div class="game-name">بصره</div>
            </div>
        </div>
    </div>

    <!-- حاوية اللعبة الاحترافية -->
    <div id="game-container">
        <button class="back-btn" onclick="closeGame()">🔙 رجوع</button>
        <div id="game-content"></div>
    </div>

    <script>
        // تهيئة بيئة تيليجرام الرسمية باحترافية
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e) {}

        let playerBalance = 1000;

        function modifyBalance(amount) {
            playerBalance += amount;
            document.getElementById('user-score').innerText = playerBalance;
        }

        function openGame(gameKey) {
            document.getElementById('platform-menu').style.display = 'none';
            let container = document.getElementById('game-container');
            container.style.display = 'block';
            let content = document.getElementById('game-content');

            switch(gameKey) {
                case 'rps':
                    content.innerHTML = `
                        <div class="game-panel-title">✂️ تحدي حجر ورقة مقص</div>
                        <p style="color:var(--text-muted); font-size:14px;">اختر سلاحك وتحدى الذكاء الاصطناعي:</p>
                        <div>
                            <button class="choice-btn" onclick="playRPS('حجر')">🪨 حجر</button>
                            <button class="choice-btn" onclick="playRPS('ورقة')">📄 ورقة</button>
                            <button class="choice-btn" onclick="playRPS('مقص')">✂️ مقص</button>
                        </div>
                        <div id="game-result" class="result-box">اختر حركتك للبدء..</div>
                    `;
                    break;
                case 'roulette':
                    content.innerHTML = `
                        <div class="game-panel-title">🎰 روليت الحظ السريع</div>
                        <p style="color:var(--text-muted); font-size:14px;">كل تدويرة تكلف 50 ل.س ومضاعفاتها مضمونة!</p>
                        <button class="action-btn" onclick="spinRoulette()">🎲 تدوير العجلة الآن</button>
                        <div id="game-result" class="result-box">اضغط لاختبار حظك..</div>
                    `;
                    break;
                case 'solitaire':
                    content.innerHTML = `
                        <div class="game-panel-title">🎴 سوليتير الترتيب الذكي</div>
                        <p style="color:var(--text-muted); font-size:14px;">اسحب ورقة لاكتشاف رابحك اليومي:</p>
                        <button class="action-btn" onclick="playSolitaire()">🃏 سحب ورقة جديدة</button>
                        <div id="game-result" class="result-box">في انتظار السحب...</div>
                    `;
                    break;
                case 'chess':
                    content.innerHTML = `
                        <div class="game-panel-title">♟️ تحدي الشطرنج السريع</div>
                        <p style="color:var(--text-muted); font-size:14px;">نفذ حركة افتتاحية صحيحة لكسب المكافأة:</p>
                        <button class="action-btn" onclick="playChess()">🎯 نقل الحصان (Nf3)</button>
                        <div id="game-result" class="result-box">قم بتنفيذ الحركة الآن..</div>
                    `;
                    break;
                case 'tarneeb':
                    content.innerHTML = `
                        <div class="game-panel-title">🃏 طرنيب الجلسات</div>
                        <p style="color:var(--text-muted); font-size:14px;">حدد طلبك واربح التحدي:</p>
                        <button class="action-btn" onclick="playTarneeb(7)">♠️ اطلب 7</button>
                        <button class="action-btn" onclick="playTarneeb(9)">♥️ اطلب 9</button>
                        <div id="game-result" class="result-box">اختر عدد الطرنيب..</div>
                    `;
                    break;
                case 'trix':
                    content.innerHTML = `
                        <div class="game-panel-title">👑 تريكس الملوك</div>
                        <p style="color:var(--text-muted); font-size:14px;">اختر مملكة اللعب المفضلة لديك:</p>
                        <button class="action-btn" onclick="alert('تم تفعيل مملكة القلوب بنجاح! ❤️'); modifyBalance(100);">❤️ قلوب</button>
                        <button class="action-btn" onclick="alert('تم تفعيل مملكة الديناري بنجاح! ♦️'); modifyBalance(100);">♦️ ديناري</button>
                        <div id="game-result" class="result-box" style="color:var(--accent-cyan);">المملكة جاهزة للمنافسة!</div>
                    `;
                    break;
                case 'basra':
                    content.innerHTML = `
                        <div class="game-panel-title">🎯 بصره المصرية</div>
                        <p style="color:var(--text-muted); font-size:14px;">اجمع الورق واقفل الطاولة:</p>
                        <button class="action-btn" onclick="modifyBalance(150); document.getElementById('game-result').innerText='💥 بصره صحيحة! +150 نقطة';">💥 لم الطاولة (بصره)</button>
                        <div id="game-result" class="result-box">اضغط عند اكتمال الطاولة..</div>
                    `;
                    break;
            }
        }

        function closeGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('platform-menu').style.display = 'block';
        }

        // خوارزميات الألعاب التفاعلية المحدثة
        function playRPS(playerChoice) {
            const choices = ['حجر', 'ورقة', 'مقص'];
            const botChoice = choices[Math.floor(Math.random() * choices.length)];
            let resText = "", color = "#fff";

            if (playerChoice === botChoice) {
                resText = `🤝 تعادل! الذكاء الاصطناعي اختار (${botChoice})`;
                color = "#fbbf24";
            } else if (
                (playerChoice === 'حجر' && botChoice === 'مقص') ||
                (playerChoice === 'ورقة' && botChoice === 'حجر') ||
                (playerChoice === 'مقص' && botChoice === 'ورقة')
            ) {
                resText = `🎉 مبروك فزت بالجولة! (+100 ل.س) [البوت: ${botChoice}]`;
                color = "#34d399";
                modifyBalance(100);
            } else {
                resText = `❌ خسرت الجولة! (-50 ل.س) [البوت: ${botChoice}]`;
                color = "#f87171";
                modifyBalance(-50);
            }
            document.getElementById('game-result').innerHTML = `<span style="color:${color};">${resText}</span>`;
        }

        function spinRoulette() {
            if (playerBalance < 50) {
                alert("عذراً، رصيدك غير كافٍ للتدوير!");
                return;
            }
            modifyBalance(-50);
            const rewards = [
                {text: "🎉 ربحت جائزة كبرى! (+400 ل.س)", val: 400},
                {text: "💎 ضعف رصيدك الحالي! (+200 ل.س)", val: 200},
                {text: "🤝 استرداد قيمة التدويرة (50 ل.س)", val: 50},
                {text: "❌ حظاً أوفر في المرة القادمة", val: 0}
            ];
            let prize = rewards[Math.floor(Math.random() * rewards.length)];
            modifyBalance(prize.val);
            document.getElementById('game-result').innerHTML = `<span style="color:var(--accent-cyan);">${prize.text}</span>`;
        }

        function playSolitaire() {
            let isWin = Math.random() > 0.4;
            if (isWin) {
                modifyBalance(90);
                document.getElementById('game-result').innerHTML = `<span style="color:#34d399;">🎉 ورقة ذهبية رابحة! (+90 ل.س)</span>`;
            } else {
                document.getElementById('game-result').innerHTML = `<span style="color:#f87171;">❌ ورقة عادية، حاول مجدداً.</span>`;
            }
        }

        function playChess() {
            modifyBalance(120);
            document.getElementById('game-result').innerHTML = `<span style="color:#34d399;">✨ تكتيك عبقري! تفوقت بالافتتاحية (+120 ل.س)</span>`;
        }

        function playTarneeb(bid) {
            let success = Math.random() > 0.5;
            if (success) {
                let prize = bid * 35;
                modifyBalance(prize);
                document.getElementById('game-result').innerHTML = `<span style="color:#34d399;">♠️ كفو! نجح طلب الـ ${bid} وأضفنا (+${prize} ل.س)</span>`;
            } else {
                modifyBalance(-100);
                document.getElementById('game-result').innerHTML = `<span style="color:#f87171;">❌ أكلت "شيبة"! خسرنا الرهان (-100 ل.س)</span>`;
            }
        }
    </script>
</body>
</html>
