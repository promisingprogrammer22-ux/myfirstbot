<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب الذكية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #00fff5;
            font-size: 24px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00fff5;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:hover {
            background: rgba(0, 255, 245, 0.2);
            transform: scale(1.05);
        }
        .icon {
            font-size: 35px;
            margin-bottom: 10px;
        }
        .name {
            font-size: 16px;
            font-weight: bold;
        }
        #gameModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #16213e;
            border: 2px solid #00fff5;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }
        .modal-content h3 {
            color: #00fff5;
            margin-bottom: 15px;
        }
        .btn-choice {
            background: #00fff5;
            color: #1a1a2e;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-mode {
            background: #ff4757;
            color: white;
        }
        .close-btn {
            background: #57606f;
            color: white;
            margin-top: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #00fff5;
            background: #1a1a2e;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🎮 منصة الألعاب الترفيهية</h1>
    <div class="grid" id="gamesGrid">
        <div class="card" onclick="selectMode('روليت', '🎰')">
            <div class="icon">🎰</div>
            <div class="name">روليت</div>
        </div>
        <div class="card" onclick="selectMode('طرنيب', '🃏')">
            <div class="icon">🃏</div>
            <div class="name">طرنيب</div>
        </div>
        <div class="card" onclick="selectMode('تريكس', '👑')">
            <div class="icon">👑</div>
            <div class="name">تريكس</div>
        </div>
        <div class="card" onclick="selectMode('سوليتير', '🎴')">
            <div class="icon">🎴</div>
            <div class="name">سوليتير</div>
        </div>
        <div class="card" onclick="selectMode('بصره', '🎯')">
            <div class="icon">🎯</div>
            <div class="name">بصره</div>
        </div>
        <div class="card" onclick="selectMode('شطرنج', '♟️')">
            <div class="icon">♟️</div>
            <div class="name">شطرنج</div>
        </div>
        <div class="card" onclick="selectMode('حجر ورقة مقص', '✂️')">
            <div class="icon">✂️</div>
            <div class="name">حجر ورقة مقص</div>
        </div>
    </div>

    <div id="gameModal">
        <div class="modal-content" id="modalBody">
            <h3 id="gameTitle">عنوان اللعبة</h3>
            <p id="gameDesc">اختر نمط اللعب المفضلك:</p>
            <div id="gameArea"></div>
            <button class="btn-choice close-btn" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        let currentGame = "";

        function selectMode(gameName, icon) {
            currentGame = gameName;
            document.getElementById('gameModal').style.display = 'flex';
            document.getElementById('gameTitle').innerText = `${icon} ${gameName}`;
            document.getElementById('gameDesc').innerText = "اختر كيف تريد أن تلعب الآن:";
            
            document.getElementById('gameArea').innerHTML = `
                <button class="btn-choice" onclick="startSoloGame()">🤖 اللعب الفردي (ضد البوت)</button>
                <button class="btn-choice btn-mode" onclick="generatePartnerLink()">🔗 تحدي صديق (نظام الشراكة)</button>
                <p id="actionRes" style="margin-top:15px; color:#00fff5; font-weight:bold;"></p>
            `;
        }

        function startSoloGame() {
            let areaHTML = "";
            if(currentGame === 'حجر ورقة مقص') {
                document.getElementById('gameDesc').innerText = "اختر سلاحك واهزم البوت:";
                areaHTML = `
                    <button class="btn-choice" onclick="rpsResult('حجر')">🪨 حجر</button>
                    <button class="btn-choice" onclick="rpsResult('ورقة')">📄 ورقة</button>
                    <button class="btn-choice" onclick="rpsResult('مقص')">✂️ مقص</button>
                    <p id="rpsResultText" style="margin-top: 15px; font-weight: bold; color: #00fff5;"></p>
                `;
            } else if(currentGame === 'روليت') {
                document.getElementById('gameDesc').innerText = "تدوير عجلة الحظ الفردية:";
                areaHTML = `<button class="btn-choice" onclick="spinRoulette()">تدوير العجلة</button><p id="rouletteRes" style="margin-top:15px; color:#00fff5; font-weight:bold;"></p>`;
            } else {
                document.getElementById('gameDesc').innerText = `أنت تلعب ${currentGame} ضد البوت الآن!`;
                areaHTML = `<button class="btn-choice" onclick="playGenericSolo()">بدء الجولة السريعة</button><p id="genericRes" style="margin-top:15px; color:#00fff5; font-weight:bold;"></p>`;
            }
            document.getElementById('gameArea').innerHTML = areaHTML;
        }

        function generatePartnerLink() {
            document.getElementById('gameDesc').innerText = "تم إنشاء رابط التحدي الخاص بك بنجاح! أرسله لصديقك:";
            const uniqueLink = `https://t.me/your_bot_username?start=challenge_${Math.floor(Math.random() * 100000)}`;
            document.getElementById('gameArea').innerHTML = `
                <input type="text" id="linkBox" value="${uniqueLink}" readonly>
                <button class="btn-choice" style="margin-top:10px; background:#2ed573; color:white;" onclick="copyLink()">📋 نسخ الرابط</button>
                <p id="copyRes" style="margin-top:10px; color:#00fff5; font-weight:bold;"></p>
            `;
        }

        function copyLink() {
            const copyText = document.getElementById('linkBox');
            copyText.select();
            document.execCommand('copy');
            document.getElementById('copyRes').innerText = "تم نسخ الرابط! أرسله لصديقك الآن 🚀";
        }

        function spinRoulette() {
            const prizes = ['ربحت 100 نقطة! 🎁', 'حظ أوفر مرة أخرى ❌', 'ربحت مضاعفة النقاط! 🚀'];
            document.getElementById('rouletteRes').innerText = prizes[Math.floor(Math.random() * prizes.length)];
        }

        function playGenericSolo() {
            const results = ['أنت البطل، فزت بالجولة! 🏆', 'محاولة رائعة، تعادل مع البوت 🤝', 'خسرت الجولة، حاول مرة أخرى! 💻'];
            document.getElementById('genericRes').innerText = results[Math.floor(Math.random() * results.length)];
        }

        function rpsResult(playerChoice) {
            const choices = ['حجر', 'ورقة', 'مقص'];
            const botChoice = choices[Math.floor(Math.random() * choices.length)];
            let res = "";
            if (playerChoice === botChoice) {
                res = `تعادل! اختيار البوت: ${botChoice}`;
            } else if (
                (playerChoice === 'حجر' && botChoice === 'مقص') ||
                (playerChoice === 'ورقة' && botChoice === 'حجر') ||
                (playerChoice === 'مقص' && botChoice === 'ورقة')
            ) {
                res = `أنت الفائز! 🏆 اختيار البوت: ${botChoice}`;
            } else {
                res = `خسرت أمام البوت! 😢 اختيار البوت: ${botChoice}`;
            }
            document.getElementById('rpsResultText').innerText = res;
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }
    </script>

</body>
</html>
