<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب الذكية الاحترافية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #00fff5;
            font-size: 22px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00fff5;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:hover {
            background: rgba(0, 255, 245, 0.2);
            transform: scale(1.05);
        }
        .icon {
            font-size: 35px;
            margin-bottom: 10px;
        }
        .name {
            font-size: 16px;
            font-weight: bold;
        }
        #gameModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #16213e;
            border: 2px solid #00fff5;
            padding: 20px;
            border-radius: 15px;
            width: 95%;
            max-width: 380px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            color: #00fff5;
            margin-bottom: 10px;
        }
        .btn-choice {
            background: #00fff5;
            color: #1a1a2e;
            border: none;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-mode {
            background: #ff4757;
            color: white;
        }
        .close-btn {
            background: #57606f;
            color: white;
            margin-top: 15px;
        }
        /* تصميم كروت اللعب للطرنيب */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 15px 0;
        }
        .playing-card {
            background: white;
            color: #1a1a2e;
            border-radius: 8px;
            width: 50px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .playing-card:hover {
            transform: translateY(-5px);
            background: #f1f2f6;
        }
        .table-area {
            background: rgba(0,0,0,0.3);
            border: 1px dashed #00fff5;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            min-height: 80px;
        }
    </style>
</head>
<body>

    <h1>🎮 منصة الألعاب الاحترافية</h1>
    <div class="grid" id="gamesGrid">
        <div class="card" onclick="openGameMenu('طرنيب', '🃏')">
            <div class="icon">🃏</div>
            <div class="name">طرنيب (حقيقية)</div>
        </div>
        <div class="card" onclick="openGameMenu('تريكس', '👑')">
            <div class="icon">👑</div>
            <div class="name">تريكس</div>
        </div>
        <div class="card" onclick="openGameMenu('روليت', '🎰')">
            <div class="icon">🎰</div>
            <div class="name">روليت</div>
        </div>
        <div class="card" onclick="openGameMenu('سوليتير', '🎴')">
            <div class="icon">🎴</div>
            <div class="name">سوليتير</div>
        </div>
        <div class="card" onclick="openGameMenu('بصره', '🎯')">
            <div class="icon">🎯</div>
            <div class="name">بصره</div>
        </div>
        <div class="card" onclick="openGameMenu('شطرنج', '♟️')">
            <div class="icon">♟️</div>
            <div class="name">شطرنج</div>
        </div>
        <div class="card" onclick="openGameMenu('حجر ورقة مقص', '✂️')">
            <div class="icon">✂️</div>
            <div class="name">حجر ورقة مقص</div>
        </div>
    </div>

    <div id="gameModal">
        <div class="modal-content" id="modalBody">
            <h3 id="gameTitle">عنوان اللعبة</h3>
            <p id="gameDesc">محتوى اللعبة...</p>
            <div id="gameArea"></div>
            <button class="btn-choice close-btn" onclick="closeModal()">إغلاق النافذة</button>
        </div>
    </div>

    <script>
        let currentGame = "";

        function openGameMenu(gameName, icon) {
            currentGame = gameName;
            document.getElementById('gameModal').style.display = 'flex';
            document.getElementById('gameTitle').innerText = `${icon} ${gameName}`;
            
            if(gameName === 'طرنيب') {
                document.getElementById('gameDesc').innerText = "لعبة طرنيب التذكية: اطلب الطرنيب والعب أوراقك بذكاء لهزم الخصوم!";
                document.getElementById('gameArea').innerHTML = `
                    <button class="btn-choice" onclick="startTarneebGame()">بدء جولة طرنيب جديدة</button>
                `;
            } else {
                document.getElementById('gameDesc').innerText = "اختر نمط اللعب:";
                document.getElementById('gameArea').innerHTML = `
                    <button class="btn-choice" onclick="startGenericSolo('${gameName}')">🤖 اللعب الفردي ضد البوت</button>
                    <button class="btn-choice btn-mode" onclick="generatePartnerLink()">🔗 تحدي صديق عبر رابط</button>
                    <p id="subRes" style="margin-top:10px; color:#00fff5; font-weight:bold;"></p>
                `;
            }
        }

        // محرك لعبة الطرنيب الحقيقية المصغرة
        function startTarneebGame() {
            document.getElementById('gameDesc').innerText = "اختر ورقة للعبها على الطاولة:";
            const playerHand = [
                {name: 'قص سبيت ♠', val: 14},
                {name: 'ملك كلف ♣', val: 13},
                {name: '10 هارت ♥', val: 10},
                {name: '7 دمنه ♦', val: 7},
                {name: '5 سبيت ♠', val: 5}
            ];

            let cardsHTML = `<div class="table-area">طاولة اللعب: <span id="tableCard" style="color:#ff4757;">في انتظار لعبتك...</span></div><p>أوراقك في اليد:</p><div class="cards-container">`;
            playerHand.forEach((card, index) => {
                cardsHTML += `<div class="playing-card" onclick="playTarneebCard('${card.name}', ${card.val})"><span>${card.name.split(' ')[0]}</span><span style="font-size:12px;">${card.name.split(' ')[1]}</span></div>`;
            });
            cardsHTML += `</div><p id="tarneebResult" style="margin-top:10px; color:#00fff5; font-weight:bold;"></p>`;
            document.getElementById('gameArea').innerHTML = cardsHTML;
        }

        function playTarneebCard(cardName, val) {
            const botCards = ['قص هارت ♥', 'ملك سبيت ♠', '10 كلف ♣', '9 دمنه ♦'];
            const botPlayed = botCards[Math.floor(Math.random() * botCards.length)];
            
            document.getElementById('tableCard').innerText = `البوت لعب: ${botPlayed} | أنت لعبت: ${cardName}`;
            
            let roundRes = (val > 8) ? "أنت فزت بهذه الجولة وأخذت الأكل! 🏆" : "البوت غطى عليك، خسرت الأكل! 😢";
            document.getElementById('tarneebResult').innerText = roundRes;
        }

        function startGenericSolo(name) {
            document.getElementById('subRes').innerText = `جاري تشغيل لعبة ${name} الفردية... تفاعل الآن!`;
        }

        function generatePartnerLink() {
            const uniqueLink = `https://t.me/your_bot_username?start=game_${Math.floor(Math.random() * 100000)}`;
            document.getElementById('subRes').innerHTML = `رابط التحدي:<br><input type="text" value="${uniqueLink}" readonly style="width:100%; padding:5px; margin-top:5px; text-align:center;"><br><span style="color:#2ed573;">تم الإنشاء! أرسله لصديقك.</span>`;
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }
    </script>

</body>
</html>
