<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة الترفيه الاحترافية - Master VIP Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --bg-base: #030712;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-gold: #fbbf24;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 0, 127, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 12px;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* رأس الحساب الحي */
        .hud-header {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            padding: 12px 16px;
            max-width: 420px;
            margin: 0 auto 12px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .hud-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--neon-cyan);
            cursor: pointer;
        }
        .hud-balance {
            font-size: 16px;
            font-weight: 900;
            color: var(--neon-gold);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
            transition: transform 0.2s;
        }
        .hud-balance.pop {
            transform: scale(1.2);
        }

        /* لوحة الإيداع السريع */
        .deposit-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 14px;
            padding: 10px 14px;
            max-width: 420px;
            margin: 0 auto 12px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .deposit-info {
            font-size: 12px;
            color: #cbd5e1;
            text-align: right;
        }
        .deposit-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 900;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            transition: 0.2s;
        }
        .deposit-btn:active { transform: scale(0.95); }

        /* لوحة التحكم الخفية للمبرمج (Admin Panel) */
        .admin-panel {
            display: none;
            background: rgba(15, 23, 42, 0.95);
            border: 2px dashed var(--neon-cyan);
            border-radius: 16px;
            padding: 15px;
            max-width: 420px;
            margin: 0 auto 12px auto;
            text-align: right;
        }
        .admin-title {
            font-size: 14px;
            font-weight: 900;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-input {
            width: 100%;
            background: #030712;
            border: 1px solid #334155;
            color: white;
            padding: 8px;
            border-radius: 8px;
            font-family: 'Cairo';
            margin-bottom: 8px;
            font-size: 13px;
        }
        .admin-action-btn {
            background: var(--neon-cyan);
            color: #030712;
            font-weight: 900;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        /* الحاوية الرئيسية للعجلة */
        .arcade-container {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 0, 127, 0.4);
            border-radius: 24px;
            padding: 16px 10px;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 15px 40px rgba(255, 0, 127, 0.2);
            position: relative;
        }

        .wheel-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 10px auto 16px auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.2));
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid var(--neon-pink);
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.8));
            z-index: 10;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--neon-pink), #cc0066);
            color: white;
            border: none;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 900;
            padding: 12px 34px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
            transition: all 0.2s;
        }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { background: #334155; color: #94a3b8; box-shadow: none; cursor: not-allowed; }

        .result-display {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 700;
            min-height: 28px;
            color: var(--neon-cyan);
        }
    </style>
</head>
<body>

    <!-- رأس الحساب الحي مع مفتاح سري للوحة التحكم -->
    <div class="hud-header">
        <div class="hud-title" onclick="toggleAdminPanel()">⚡ لوحة الإدارة [⚙️]</div>
        <div class="hud-balance" id="balance-box">1000 🪙</div>
    </div>

    <!-- لوحة التحكم الإدارية الخاصة بك (تفتح بالضغط على عنوان الرأس) -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">
            <span>🛠️ لوحة تحكم المبرمج الخبير</span>
            <span style="cursor:pointer;" onclick="toggleAdminPanel()">✕</span>
        </div>
        <div style="font-size:11px; color:#94a3b8; margin-bottom:6px;">التحكم اليدوي المباشر برصيد الحساب:</div>
        <input type="number" id="customAmount" class="admin-input" placeholder="أدخل قيمة الرصيد الجديد...">
        <button class="admin-action-btn" onclick="adminSetBalance()">تحديث الرصيد الفوري</button>
    </div>

    <!-- لوحة الإيداع الفوري -->
    <div class="deposit-panel">
        <div class="deposit-info">
            <strong>شحن رصيد الإيداع</strong><br>
            <span>أضف 500 نقطة للبدء</span>
        </div>
        <button class="deposit-btn" onclick="makeDeposit()">إيداع فوري 💳</button>
    </div>

    <!-- صالة العجلة الحية -->
    <div class="arcade-container">
        <div style="font-size:15px; font-weight:900; margin-bottom:4px; color:var(--text-main);">عجلة المضاعفات المدفوعة</div>
        <div style="font-size:11px; color:#94a3b8; margin-bottom:12px;">تكلفة التدوير: <strong style="color:var(--neon-gold)">100 نقطة إيداع</strong></div>

        <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>

        <button class="spin-btn" id="spinBtn" onclick="startSpinning()">تدوير العجلة (100 🪙) 🎲</button>
        <div class="result-display" id="resultText">جاهز للتحدي..</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e) {}

        let balance = 1000;
        let isSpinning = false;
        let currentAngle = 0;

        const sectors = [
            { label: "1000 🪙", color: "#ff007f", value: 1000 },
            { label: "تخطي", color: "#1e293b", value: 0 },
            { label: "400 🪙", color: "#00f0ff", value: 400 },
            { label: "200 🪙", color: "#3b82f6", value: 200 },
            { label: "2500 🪙", color: "#fbbf24", value: 2500 },
            { label: "استرداد", color: "#8b5cf6", value: 100 },
            { label: "600 🪙", color: "#ec4899", value: 600 },
            { label: "حظاً أوفر", color: "#0f172a", value: 0 }
        ];

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const arcSize = (2 * Math.PI) / sectors.length;

        function drawWheel(angle = 0) {
            let center = canvas.width / 2;
            let radius = center - 10;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(angle);

            sectors.forEach((sec, i) => {
                let startAngle = i * arcSize;
                let endAngle = (i + 1) * arcSize;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = sec.color;
                ctx.fill();
                ctx.strokeStyle = "#030712";
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.save();
                ctx.rotate(startAngle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 26px 'Cairo', sans-serif";
                ctx.fillText(sec.label, radius - 35, 10);
                ctx.restore();
            });

            ctx.restore();

            ctx.beginPath();
            ctx.arc(center, center, 45, 0, 2 * Math.PI);
            ctx.fillStyle = "#0f172a";
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#fbbf24";
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Cairo', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("VIP", center, center);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'tick') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function updateBalance(amount) {
            balance += amount;
            let box = document.getElementById("balance-box");
            box.innerText = balance + " 🪙";
            box.classList.add("pop");
            setTimeout(() => box.classList.remove("pop"), 200);
        }

        // وظائف لوحة التحكم الإدارية الخاصة بك
        function toggleAdminPanel() {
            let panel = document.getElementById("adminPanel");
            panel.style.display = panel.style.display === "block" ? "none" : "block";
        }

        function adminSetBalance() {
            let val = parseInt(document.getElementById("customAmount").value);
            if (!isNaN(val)) {
                balance = val;
                document.getElementById("balance-box").innerText = balance + " 🪙";
                alert("تم تحديث الرصيد إدارياً بنجاح!");
            }
        }

        function makeDeposit() {
            updateBalance(500);
            document.getElementById("resultText").innerHTML = `<span style="color:var(--neon-gold);">✅ تم إيداع 500 نقطة بنجاح!</span>`;
        }

        function startSpinning() {
            if (isSpinning) return;
            const spinCost = 100;

            if (balance < spinCost) {
                alert("رصيدك لا يكفي للتدوير! قم بالإيداع أولاً.");
                return;
            }

            updateBalance(-spinCost);
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("resultText").innerText = "العجلة تدور بحماسة...";

            let extraSpins = (Math.floor(Math.random() * 4) + 5) * (2 * Math.PI);
            let randomSectorIndex = Math.floor(Math.random() * sectors.length);
            let targetAngle = currentAngle + extraSpins + (randomSectorIndex * arcSize);

            let startTime = null;
            let duration = 4000;
            let lastTickAngle = currentAngle;

            function animateSpin(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / duration;

                if (progress < 1) {
                    let easeProgress = 1 - Math.pow(1 - progress, 3);
                    let currentPosition = currentAngle + (targetAngle - currentAngle) * easeProgress;
                    
                    drawWheel(currentPosition);

                    if (Math.abs(currentPosition - lastTickAngle) > arcSize / 2) {
                        playSound('tick');
                        lastTickAngle = currentPosition;
                    }

                    requestAnimationFrame(animateSpin);
                } else {
                    currentAngle = targetAngle % (2 * Math.PI);
                    drawWheel(currentAngle);
                    isSpinning = false;
                    document.getElementById("spinBtn").disabled = false;

                    let normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
                    let winningIndex = Math.floor(normalizedAngle / arcSize) % sectors.length;
                    let prize = sectors[winningIndex];

                    let resBox = document.getElementById("resultText");
                    if (prize.value > 0) {
                        playSound('win');
                        updateBalance(prize.value);
                        resBox.innerHTML = `<span style="color:var(--neon-gold);">🎉 مبروك! ربحت ${prize.label}!</span>`;
                    } else {
                        resBox.innerHTML = `<span style="color:#f87171;">❌ حظاً أوفر، جرب مرة أخرى!</span>`;
                    }
                }
            }

            requestAnimationFrame(animateSpin);
        }

        drawWheel(0);
    </script>
</body>
</html>
