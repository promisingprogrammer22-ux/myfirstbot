<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة سوليتير الاحترافية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #065f46 0%, #022c22 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow: hidden;
        }

        /* طاولة السوليتير الخضراء الفاخرة */
        .solitaire-table {
            width: 100%;
            max-width: 480px;
            height: 75vh;
            background: rgba(2, 44, 34, 0.6);
            border: 4px solid #34d399;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .top-piles {
            display: flex;
            gap: 15px;
        }

        .pile {
            width: 50px;
            height: 70px;
            border: 2px dashed rgba(52, 211, 153, 0.5);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #34d399;
            background: rgba(0, 0, 0, 0.2);
        }

        .center-msg {
            text-align: center;
        }

        .center-msg h2 {
            color: #34d399;
            font-size: 18px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
        }

        .center-msg p {
            font-size: 13px;
            color: #cbd5e1;
        }

        .tableau {
            display: flex;
            gap: 8px;
        }

        .card-stack {
            width: 45px;
            height: 65px;
            background: #ffffff;
            color: #dc2626;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        /* لوحة التحكم السفلية */
        .controls-panel {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .btn {
            background: #34d399;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #10b981;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.6);
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- طاولة السوليتير -->
    <div class="solitaire-table">
        <div class="top-piles">
            <div class="pile">♠</div>
            <div class="pile">♥</div>
            <div class="pile">♦</div>
            <div class="pile">♣</div>
        </div>

        <div class="center-msg">
            <h2>🃏 سوليتير الصبر الذكي</h2>
            <p id="solitaireStatus">رتب الأوراق بالتناوب والترتيب الصحيح...</p>
        </div>

        <div class="tableau">
            <div class="card-stack"><span>♠ K</span><span>K</span></div>
            <div class="card-stack" style="color: #000;"><span>♣ Q</span><span>Q</span></div>
            <div class="card-stack"><span>♥ J</span><span>J</span></div>
            <div class="card-stack" style="color: #000;"><span>♦ 10</span><span>10</span></div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="controls-panel">
        <a href="games_platform.html" class="back-link">⬅ عودة للمنصة</a>
        <button class="btn" onclick="startSolitaire()">سحب ورقة 🃏</button>
        <span style="font-size: 13px; color: #4ade80;" id="solitaireScore">الحركات: 0</span>
    </div>

    <script>
        function startSolitaire() {
            document.getElementById("solitaireStatus").innerText = "تم سحب ورقة جديدة، تابع الترتيب الذكي!";
            alert("أهلاً بك في لعبة السوليتير! رتب أوراقك بحنكة.");
        }
    </script>

</body>
</html>
